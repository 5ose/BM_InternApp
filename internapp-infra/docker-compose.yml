services:

  mysql:
    image: mysql:latest
    environment:
      MYSQL_DATABASE: internship_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  seaweedfs:
    image: chrislusf/seaweedfs
    container_name: seaweedfs
    command: server -dir=/data
    ports:
      - "9333:9333"
      - "8090:8080"
      - "8888:8888"

volumes:
  mysql-data: