spring:
  application:
    name: demo

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/internship_db}
    username: ${DB_USERNAME:intern_user}
    password: ${DB_PASSWORD:intern_pass}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

seaweedfs:
  master-url: http://localhost:9333
  volume-url: http://localhost:8090
